[package]
name = "md-viewer"
version = "0.1.0"
edition = "2021"
description = "A self-contained CLI to view markdown and YAML files as beautiful HTML pages"

[[bin]]
name = "md-viewer"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
pulldown-cmark = "0.12"
tiny_http = "0.12"
include_dir = "0.7"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
