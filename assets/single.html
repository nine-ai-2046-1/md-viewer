<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="/base/style.css">
  <link rel="stylesheet" href="/base/prism.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar" role="navigation">
  <button class="icon-btn" id="sidebar-btn" onclick="toggleSidebar()" aria-label="Toggle sidebar" title="Toggle sidebar">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <a href="/" class="navbar-brand">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    <span>{{TITLE}}</span>
  </a>
  <div class="navbar-spacer"></div>
  <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" aria-label="Switch to light mode" title="Toggle theme">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</nav>

<!-- Sidebar overlay (mobile) -->
<div id="sidebar-overlay" class="sidebar-overlay"></div>

<!-- Layout -->
<div class="layout">

  <!-- Left sidebar: TOC (toggle via hamburger in navbar) -->
  <aside class="sidebar" id="sidebar" role="complementary" aria-label="Table of contents">
    <div class="sidebar-section-title">On This Page</div>
    <nav>{{TOC}}</nav>
  </aside>

  <!-- Main content: fills all available width -->
  <div class="content-wrapper" id="content-wrapper">
    <article class="article">
      <div class="markdown-body">
        {{CONTENT}}
      </div>
      <div class="doc-meta">
        Generated by md-viewer · {{GENERATED_AT}}
      </div>
    </article>
  </div>

</div>

<script src="/base/prism.js"></script>
<script src="/base/app.js"></script>
</body>
</html>
