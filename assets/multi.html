<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="/base/style.css">
  <link rel="stylesheet" href="/base/prism.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar" role="navigation">
  <button class="icon-btn" id="sidebar-btn" onclick="toggleSidebar()" aria-label="Toggle sidebar" title="Toggle sidebar">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <a href="/" class="navbar-brand">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    <span>{{SITE_TITLE}}</span>
  </a>
  <div class="navbar-spacer"></div>

  <!-- Search bar (folder mode) -->
  <div class="search-wrapper">
    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search-input" class="search-input" placeholder="Search…" autocomplete="off" spellcheck="false">
    <div id="search-results" class="search-results" role="listbox"></div>
  </div>

  <!-- TOC toggle button (shown on doc pages with headings, hidden on index) -->
  <button class="icon-btn toc-btn" id="toc-btn" onclick="toggleToc()" aria-label="Show table of contents" title="Show table of contents">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
  </button>

  <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" aria-label="Switch to light mode" title="Toggle theme">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</nav>

<!-- Sidebar overlay (mobile) -->
<div id="sidebar-overlay" class="sidebar-overlay"></div>

<!-- Layout -->
<div class="layout">

  <!-- Left sidebar: file tree (dynamic, loaded from nav.js) -->
  <aside class="sidebar" id="sidebar" role="complementary" aria-label="Document navigation">
    <div class="sidebar-section-title">{{FOLDER_LABEL}}</div>
    <nav class="file-tree" id="file-tree"></nav>
  </aside>

  <!-- Main content -->
  <div class="content-wrapper" id="content-wrapper">
    <article class="article">
      {{#IF_INDEX}}
      <!-- Home / index page -->
      <div class="home-hero">
        <h1>{{SITE_TITLE}}</h1>
        <p>{{FILE_COUNT}} documents · Browse from the sidebar or search above</p>
      </div>
      <div class="file-cards">
        {{FILE_CARDS}}
      </div>
      {{/IF_INDEX}}

      {{#IF_DOC}}
      <!-- Document page -->
      <div class="markdown-body">
        {{CONTENT}}
      </div>
      <div class="doc-meta">
        Generated by md-viewer · {{GENERATED_AT}}
      </div>
      {{/IF_DOC}}
    </article>

    <!-- Right TOC panel (toggleable, doc pages only) -->
    {{#IF_DOC}}
    <div class="toc-panel" role="navigation" aria-label="In this document">
      <div class="toc-title">Contents</div>
      {{TOC}}
    </div>
    {{/IF_DOC}}
  </div>

</div>

<!-- Per-page current path (must stay inline, differs per page) -->
<script>var CURRENT_PAGE='{{CURRENT_PAGE}}';</script>
<!-- Shared navigation data: FILE_TREE + SEARCH_INDEX (single source of truth) -->
<script src="/base/nav.js"></script>

<script src="/base/prism.js"></script>
<script src="/base/fuse.js"></script>
<script src="/base/app.js"></script>
<script src="/base/sidebar.js"></script>
</body>
</html>
